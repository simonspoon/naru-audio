# Kyutai Pocket TTS, the sherpa-onnx int8 export (2026-01-26). Archive size
# and hash, and every [[file]] size and hash, computed 2026-09-25 from the
# release tarball, one entry per file in it.
#
# Licence: the model is CC-BY-4.0 (kyutai/pocket-tts; LICENSE below). The
# package README also says "It is for non-commercial" and points at the
# ONNX export's LICENSE; the test_wavs are from
# kyutai-labs/delayed-streams-modeling. That README statement, not the
# CC-BY-4.0 grant, is why `non_commercial` is set below.
#
# Pocket has one speaker (`sid` 0) and clones the voice from a reference
# recording, so each [[voice]] names one of the package's test_wavs. The
# French sample is left out: the model speaks English only.

[model]
name        = "pocket-tts-int8"
kind        = "tts"
backend     = "sherpa-onnx"
platforms   = ["macos-arm64", "macos-x86_64", "linux-x86_64", "linux-arm64"]
languages   = ["en"]
license     = "CC-BY-4.0"
license_url = "https://creativecommons.org/licenses/by/4.0/"
non_commercial = true                    # see the README caveat above
resident_bytes = 700_000_000             # daemon peak RSS serving it, 2026-09-25; state/measured.json corrects it

[backend.sherpa-onnx]
family           = "pocket"
lm_flow          = "lm_flow.int8.onnx"
lm_main          = "lm_main.int8.onnx"
encoder          = "encoder.onnx"
decoder          = "decoder.int8.onnx"
text_conditioner = "text_conditioner.onnx"
vocab_json       = "vocab.json"
token_scores_json = "token_scores.json"

[[archive]]
url    = "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-pocket-tts-int8-2026-01-26.tar.bz2"
sha256 = "2f3b88823cbbb9bf0b2477ec8ae7b3fec417b3a87b6bb5f256dba66f2ad967cb"
size   = 98_336_520
strip  = 1                               # sherpa-onnx-pocket-tts-int8-2026-01-26/

[[voice]]
id = "bria"
sid = 0
reference = "test_wavs/bria.wav"
gender = "f"
default = true

[[voice]]
id = "loona"
sid = 0
reference = "test_wavs/loona.wav"
gender = "f"

