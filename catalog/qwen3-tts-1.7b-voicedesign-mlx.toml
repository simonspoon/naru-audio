# Qwen3-TTS 1.7B VoiceDesign, mlx-community's 8-bit conversion, served
# by mlx-audio in the MLX sidecar (§5.3). VoiceDesign has no preset
# speakers and clones nothing: it makes up the voice from a description,
# the request's `instructions` (§2.3), which mlx-audio takes as
# `instruct`. 1.7B, as Qwen ships VoiceDesign in no smaller size. 8-bit,
# as for CustomVoice. Every [[file]] of the repo at the pinned commit but
# README.md and .gitattributes; sizes and LFS hashes from the HF API, the
# other hashes computed 2026-09-25 from the files at the pinned commit.

[model]
name        = "qwen3-tts-1.7b-voicedesign-mlx"
kind        = "tts"
backend     = "mlx"
# Listed on Intel too, so it shows there with x_available:false (§3.6).
platforms   = ["macos-arm64", "macos-x86_64"]
languages   = ["en", "zh", "de", "it", "pt", "es", "ja", "ko", "fr", "ru"]
license     = "Apache-2.0"
license_url = "https://www.apache.org/licenses/LICENSE-2.0"
# An estimate, not measured: 3.08 GB of weights, plus the ~0.6 GB that
# loading and generating add over the weights for the 0.6B models. What a
# load measures replaces it: the load's delta in `stats`.
resident_bytes = 3_800_000_000

[backend.mlx]
# Takes the request's `instructions` as mlx-audio's `instruct`: here the
# voice's description, required.
instruct = true
# VoiceDesign clones nothing itself; a voice it designs is saved as a
# cloned voice for this model instead, so a client can re-speak with it.
design_voice_model = "qwen3-tts-1.7b-base-mlx"

# One free-text description, no inline tags (mlx-audio's `qwen3_tts.py`
# `generate_voice_design` takes `instruct` as a single string and has no
# tag syntax of its own). `temperature`/`top_p` are `Model.generate`'s own
# sampling knobs, not currently sent by naru-audio.
[backend.mlx.prompt_format]
style = "free_text"
knobs = [
    { name = "temperature", default = 0.9, min = 0.0, max = 2.0 },
    { name = "top_p", default = 1.0, min = 0.0, max = 1.0 },
]
hint = "A cheerful young female voice with high pitch"

