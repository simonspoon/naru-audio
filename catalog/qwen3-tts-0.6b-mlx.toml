# Qwen3-TTS 0.6B CustomVoice, mlx-community's 8-bit conversion, served
# by mlx-audio in the MLX sidecar (§5.3). CustomVoice, not Base: it has
# preset speakers, where Base only clones a reference recording. 8-bit,
# not 4-bit: 2.0 GB on disk against 1.7 GB, both far under the 4 GB
# budget. Every [[file]] of the repo at the pinned commit but README.md and
# .gitattributes; sizes and hashes from the HF API, recomputed 2026-09-25
# from the downloaded files.
#
# The [[voice]] ids are the model's `spk_id` keys, which mlx-audio takes as
# `voice`; `accent` is each speaker's native language (Dylan: Beijing
# dialect, Eric: Sichuan). `sid` is unused by the mlx backend.

[model]
name        = "qwen3-tts-0.6b-mlx"
kind        = "tts"
backend     = "mlx"
# Listed on Intel too, so it shows there with x_available:false (§3.6).
platforms   = ["macos-arm64", "macos-x86_64"]
languages   = ["en", "zh", "de", "it", "pt", "es", "ja", "ko", "fr", "ru"]
license     = "Apache-2.0"
license_url = "https://www.apache.org/licenses/LICENSE-2.0"
# MLX peak while generating, 2026-09-25. What a load measures replaces it:
# the load's delta in `stats`, 2.04 GB, without the 0.5 GB that
# generating adds on top.
resident_bytes = 2_600_000_000

# No `clone`, and `instruct` stays off here (naru_1457): mlx-audio's own
# docstring says CustomVoice takes an optional `instruct` for
# emotion/style (`qwen3_tts.py generate`, "instruct: Instruction for
# emotion/style (CustomVoice) or voice description (VoiceDesign)"), but
# naru-audio has never turned it on for this model, so `instructs()` stays
# `false` and `instructions` is stripped before reaching the sidecar
# (`server/speech.rs`). `temperature`/`top_p`/`top_k` are `Model.generate`'s own
# sampling knobs, shared by every route, not currently sent by
# naru-audio.
[backend.mlx.prompt_format]
knobs = [
    { name = "temperature", default = 0.9, min = 0.0, max = 2.0 },
    { name = "top_p", default = 1.0, min = 0.0, max = 1.0 },
    { name = "top_k", default = 50, min = 0, max = 200, step = 1 },
]

[[voice]]
id = "serena"
sid = 0
accent = "zh"
gender = "f"

[[voice]]
id = "vivian"
sid = 0
accent = "zh"
gender = "f"

