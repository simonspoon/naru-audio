sid = 0
accent = "zh"
gender = "m"

[[voice]]
id = "ryan"
sid = 0
accent = "en"
gender = "m"
default = true

[[voice]]
id = "aiden"
sid = 0
accent = "en"
gender = "m"

[[voice]]
id = "ono_anna"
