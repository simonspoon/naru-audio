name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: naru-audio-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: naru-audio-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: naru-audio-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: naru-audio-darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        # g++ too: sherpa-onnx-sys links its prebuilt static libs against libstdc++.
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      # MLX (aarch64 macOS only) compiles its Metal kernels from source: it
      # needs CMake and the Metal toolchain, a separate download since Xcode 26.
      - name: Install Metal toolchain
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          cmake --version
          xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/naru-audio ${{ matrix.name }}

      # MLX loads its kernels from mlx.metallib next to the binary; build.rs
      # links it into the profile dir and cp follows the link.
      - name: Rename metallib
        if: matrix.target == 'aarch64-apple-darwin'
        run: cp target/${{ matrix.target }}/release/mlx.metallib ${{ matrix.name }}.metallib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          # The formula installs it as a resource; fail rather than ship without it.
          test -f naru-audio-darwin-arm64.metallib
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  update-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh api repos/simonspoon/homebrew-tap/dispatches \
            -f event_type=update-formula \
            -f "client_payload[tool]=naru-audio" \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[repo]=simonspoon/naru-audio"
