# pyannote/segmentation-3.0 (MIT; sherpa-onnx's ONNX export, unlisted on
# Hugging Face without a login, but this GitHub release is not gated) plus
# 3D-Speaker's English CAM++ speaker embedding (Apache-2.0). Offline speaker
# diarization for voice-prep (naru task 1461 §8): segmentation splits the
# clip into single-speaker spans, the embedding vectorises each, and
# sherpa-onnx clusters them into speakers. Sizes and hashes computed
# 2026-09-27 from the upstream releases.

[model]
name        = "speaker-diarization-en"
kind        = "diarization"
backend     = "sherpa-onnx"
platforms   = ["macos-arm64", "macos-x86_64", "linux-x86_64", "linux-arm64", "windows-x86_64"]
languages   = ["en"]
license     = "MIT AND Apache-2.0"           # segmentation MIT, embedding Apache-2.0
license_url = "https://opensource.org/license/mit/"

