# Breeze TTS 2 (BreezeBlue), mlx-community's 4-bit (mxfp4) conversion.
# Same model, licence, capabilities and prompt format as the bf16 entry
# (breeze-tts-2-mlx.toml, see its header); only the weights differ: one
# model.safetensors (~3.0 GB total) instead of two shards, and
# config.json carries a "quantization" block (4 bits, mode mxfp4).
#
# Every [[file]] of the repo at the pinned commit but README.md,
# .gitattributes and the demo mp4 (not needed to run); sizes and LFS hash from the HF API, the small files'
# hashes computed 2026-10-23 from the files at the pinned commit.

[model]
name        = "breeze-tts-2-4bit-mlx"
kind        = "tts"
backend     = "mlx"
# Listed on Intel too, so it shows there with x_available:false (§3.6).
platforms   = ["macos-arm64", "macos-x86_64"]
languages   = ["en", "zh"]
license     = "BreezeBlue Research and Non-Commercial License"
license_url = "https://huggingface.co/mlx-community/Breeze-TTS-2-mlx-4bit/blob/3a06d26b172ea4ae1da2f42d708383e9c79d5526/LICENSE"
non_commercial = true                    # see the bf16 file's LICENSE excerpt

[backend.mlx]
# Speaks in the cloned voices under $NARU_AUDIO_HOME/voices/.
clone = true
# Its `generate` raises outright without a transcript alongside the
# reference clip (breeze_tts.py: "Breeze voice cloning requires ref_text
# with ref_audio.").
clone_requires_transcript = true
# Takes the request's `instructions` as mlx-audio's `instruct`, to make a
# voice up from a description instead of cloning one.
instruct = true

# One free-text instruction, for a voice design or direction on a clone
# alike (`breeze_tts.py`: `target = f"{speaker}<ins_bos>{instruct}<ins_eos>{text}"`).
# Inline tags are BreezeBlue's own model card syntax, not something
# mlx-audio's `breeze_tts.py` parses specially — they are plain text the
# model was trained to recognise, English in parentheses and Chinese in
# brackets. `cfg_scale`'s default is `generate`'s own (no CFG unless set);
# 4 is the card's recommendation for voice design/direction, not a code
# default.
[backend.mlx.prompt_format]
style = "free_text"
inline = { syntax = "(tag) or [标签]", tags = ["laugh", "sigh", "clears throat", "笑", "叹气"], example = "(laugh) That's hilarious!" }
knobs = [{ name = "cfg_scale", default = 4.0, min = 0.0, max = 10.0 }]
hint = "Speak slowly and warmly, like reading a bedtime story"

