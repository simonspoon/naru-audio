name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # sherpa-onnx-sys's build.rs extracts its prebuilt libs into
      # target/sherpa-onnx-prebuilt, which rust-cache's cleanup empties of files
      # (keeping the dirs) before saving, while it keeps the build script's
      # output. build.rs skips the download when the lib dir exists, so drop
      # both the dir and the crate's fingerprints: build.rs reruns and fetches
      # the libs again instead of linking against an empty dir.
      - name: Refetch sherpa-onnx prebuilts
        shell: bash
        run: rm -rf target/sherpa-onnx-prebuilt target/*/.fingerprint/sherpa-onnx-sys-*

      # MLX (aarch64 macOS only) compiles its Metal kernels from source: it
      # needs CMake and the Metal toolchain, a separate download since Xcode 26.
      - name: Install Metal toolchain
        if: runner.os == 'macOS'
        run: |
          cmake --version
          xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version

      # rust-cache likewise keeps mlx-sys's build output but not the metallib
      # it writes to target/mlx ($MLX_RS_METAL_PATH), so MLX tests exit 255.
      # Drop mlx-sys's fingerprints when it is missing, so its build reruns.
      - name: Rebuild a missing mlx.metallib
        if: runner.os == 'macOS'
        shell: bash
        run: test -f target/mlx/mlx.metallib || rm -rf target/*/.fingerprint/mlx-sys-*

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # Sherpa only: MLX is aarch64-macOS (cfg-gated), so a plain build is the
  # sherpa-only feature set. Static CRT comes from .cargo/config.toml.
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # sherpa-onnx-sys's build.rs extracts its prebuilt libs into
      # target/sherpa-onnx-prebuilt, which rust-cache's cleanup empties of files
      # (keeping the dirs) before saving, while it keeps the build script's
      # output. build.rs skips the download when the lib dir exists, so drop
      # both the dir and the crate's fingerprints: build.rs reruns and fetches
      # the libs again instead of linking against an empty dir.
      - name: Refetch sherpa-onnx prebuilts
        shell: bash
        run: rm -rf target/sherpa-onnx-prebuilt target/*/.fingerprint/sherpa-onnx-sys-*

      - name: Build
        run: cargo build

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
