# Qwen3-ASR 1.7B, 4-bit: 1.6 GB on disk (Apache-2.0), mlx-community's conversion, served by
# mlx-audio in the MLX sidecar (§5.3): multilingual (the model detects the
# language itself; a request's language hint is not passed on), no word
# timestamps, no hotwords. Every [[file]] of the repo at the pinned commit
# but README.md and .gitattributes; sizes and hashes from the HF API, and
# for the small non-LFS files computed from the downloaded files.

[model]
name        = "qwen3-asr-1.7b-4bit-mlx"
kind        = "stt"
backend     = "mlx"
# Listed on Intel too, so it shows there with x_available:false (§3.6).
platforms   = ["macos-arm64", "macos-x86_64"]
languages   = ["zh", "en", "yue", "ar", "de", "fr", "es", "pt", "id", "it", "ko", "ru", "th", "vi", "ja", "tr", "hi", "ms", "nl", "sv", "da", "fi", "pl", "cs", "fil", "fa", "el", "ro", "hu", "mk"]
license     = "Apache-2.0"
license_url = "https://www.apache.org/licenses/LICENSE-2.0"
resident_bytes = 2_400_000_000           # estimate; the sidecar's `stats` corrects it
requires    = ["silero-vad", "audio-tagging-ced-tiny"]

