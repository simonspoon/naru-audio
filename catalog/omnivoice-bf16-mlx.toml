# OmniVoice (k2-fsa), mlx-community's bf16 conversion, served by mlx-audio
# in the MLX sidecar (§5.3). A fifth cloning model, and the second (after
# VoxCPM2) that also designs a voice from a description: it clones a
# reference recording the same way as the Qwen3-TTS Base pair, Chatterbox
# and VoxCPM2 (no preset speakers, so its voices are the cloned ones under
# $NARU_AUDIO_HOME/voices/, each passed to mlx-audio as `ref_audio`), and
# separately takes the request's `instructions` as mlx-audio's `instruct`
# to make a voice up from a description. Unlike VoxCPM2, OmniVoice's
# `ref_text` is not ignored: mlx-audio prepends it to the spoken text
# before tokenizing, so a cloned voice's transcript is sent as usual and
# actually used. `speed` is not supported at all — mlx-audio's `generate`
# has no `speed` parameter for it, so it would otherwise be swallowed
# silently by `**kwargs`; the sidecar shim errors on a non-1.0 speed
# instead (`naru_audio_mlx/__main__.py`), as for Chatterbox and VoxCPM2.
# 24 kHz output (`model.sample_rate`). Does not stream: mlx-audio's
# `generate` yields exactly one chunk, after the whole utterance has
# decoded, same as IndexTTS; `say -o -` still works, but all the audio
# arrives at once at the end.
#
# 646 languages per the base model's card (k2-fsa/OmniVoice's `language`
# frontmatter, copied verbatim below as ISO 639 codes).
#
# bf16, not mlx-community's 8-bit conversion: mlx-audio's OmniVoice
# `sanitize()` splits the checkpoint's single `audio_embeddings.weight` /
# `audio_heads.weight` tensors into 8 per-codebook tensors by exact key
# match, but does not do the same for their quantized `.scales` /
# `.biases` siblings, so loading mlx-community/OmniVoice-8bit fails with
# "parameters not in model" (confirmed 2026-09-26 against mlx-audio as
# installed in mlx/pyproject.toml — a bug in mlx-audio's own conversion,
# not something to route around here). bf16 has no `quantization` key in
# its config.json, so `apply_quantization` is a no-op and this problem
# does not arise; it loads and speaks correctly.
#
# Licence: k2-fsa/OmniVoice's own README says "Our code is released under
# the Apache 2.0 License. The pre-trained model is licensed under the
# CC-BY-NC due to constraints from its training data (e.g., Emilia)." —
# these are the pre-trained weights, so `non_commercial` is set below,
# same as pocket-tts-int8's README caveat (§1441). mlx-community's own
# `apache-2.0` tag on the conversion describes only their conversion code.
#
# Every [[file]] of the repo at the pinned commit but README.md and
# .gitattributes; sizes and LFS hash from the HF API, the small files'
# hashes computed 2026-09-26 from the files at the pinned commit.

[model]
name        = "omnivoice-bf16-mlx"
kind        = "tts"
