# Qwen3-TTS 0.6B Base, mlx-community's 8-bit conversion, served by
# mlx-audio in the MLX sidecar (§5.3). Base, not CustomVoice
# (qwen3-tts-0.6b-mlx): it has no preset speakers and clones a reference
# recording instead, so its voices are the cloned ones under
# $NARU_AUDIO_HOME/voices/ (`naru-audio voice add`), each passed to
# mlx-audio as `ref_audio` with its transcript as `ref_text`. 8-bit, as
# for CustomVoice. Every [[file]] of the repo at the pinned commit but
# README.md and .gitattributes; sizes and LFS hashes from the HF API, the
# other hashes computed 2026-09-25 from the files at the pinned commit.

[model]
name        = "qwen3-tts-0.6b-base-mlx"
kind        = "tts"
backend     = "mlx"
# Listed on Intel too, so it shows there with x_available:false (§3.6).
platforms   = ["macos-arm64", "macos-x86_64"]
languages   = ["en", "zh", "de", "it", "pt", "es", "ja", "ko", "fr", "ru"]
license     = "Apache-2.0"
# MLX peak while generating in a cloned voice, 2026-09-25. What a load
# measures replaces it: the load's delta in `stats`, 2.05 GB.
resident_bytes = 2_700_000_000

[backend.mlx]
# Speaks in the cloned voices under $NARU_AUDIO_HOME/voices/.
clone = true

