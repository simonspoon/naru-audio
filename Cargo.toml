[package]
name = "naru-audio"
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Local speech-to-text and text-to-speech daemon for Naru"

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
base64 = "0.22"
bzip2 = "0.6"
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hound = "3.5.1"
humantime = "2"
libc = "0.2"
rubato = "5.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sherpa-onnx = "=1.13.6"
# Not used directly: sherpa-onnx 1.13.6 does not build against sys 1.13.8.
sherpa-onnx-sys = "=1.13.6"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
tokio-tungstenite = "0.29"
toml = "1"
toml_edit = "0.25"
ureq = "3"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
