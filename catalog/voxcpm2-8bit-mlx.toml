# VoxCPM2 (OpenBMB), mlx-community's 8-bit conversion, served by mlx-audio
# in the MLX sidecar (§5.3). A fourth cloning model, but the first that
# also designs a voice from a description: it clones a reference
# recording the same way as the Qwen3-TTS Base pair and Chatterbox (no
# preset speakers, so its voices are the cloned ones under
# $NARU_AUDIO_HOME/voices/, each passed to mlx-audio as `ref_audio`; no
# transcript needed, so the cloned voice's `ref_text` is passed but
# ignored, as for Chatterbox), and separately takes the request's
# `instructions` as mlx-audio's `instruct` to make a voice up from a
# description, as Qwen3-TTS VoiceDesign does. `speed` is not supported at
# all — mlx-audio's `generate` has no `speed` parameter for it, so it
# would otherwise be swallowed silently by `**kwargs`; the sidecar shim
# errors on a non-1.0 speed instead (`naru_audio_mlx/__main__.py`), as for
# Chatterbox. 48 kHz output (`model.sample_rate`, read at load and used
# throughout: WAV header, `x-audio-sample-rate`, `/v1/models`), the first
# model in the catalog above 24 kHz.
#
# 8-bit, the best speed/quality tradeoff mlx-community publishes (bf16 and
# 4-bit also exist). Every [[file]] of the repo at the pinned commit but
# README.md, .gitattributes and the two test_*.wav samples; sizes and LFS
# hash from the HF API, the small files' hashes computed 2026-09-26 from
# the files at the pinned commit.

[model]
name        = "voxcpm2-8bit-mlx"
kind        = "tts"
backend     = "mlx"
# Listed on Intel too, so it shows there with x_available:false (§3.6).
platforms   = ["macos-arm64", "macos-x86_64"]
languages   = ["zh", "en", "ar", "my", "da", "nl", "fi", "fr", "de", "el", "he", "hi", "id", "it", "ja", "km", "ko", "lo", "ms", "no", "pl", "pt", "ru", "es", "sw", "sv", "tl", "th", "tr", "vi"]
license     = "Apache-2.0"
license_url = "https://www.apache.org/licenses/LICENSE-2.0"
# MLX active memory after a load, 2026-09-26 (`stats` delta).
resident_bytes = 3_221_641_356

[backend.mlx]
# Speaks in the cloned voices under $NARU_AUDIO_HOME/voices/.
clone = true
# Takes the request's `instructions` as mlx-audio's `instruct`, to make a
# voice up from a description instead of cloning one.
instruct = true

# Not a separate field on the wire: mlx-audio's `voxcpm2.py` `generate`
# itself prepends `instruct` onto the text as `(instruct)text` before
# tokenizing (confirmed 2026-09-27 against
# mlx/.venv/.../mlx_audio/tts/models/voxcpm2/voxcpm2.py:444-445), so the
# description rides inside the spoken text rather than a field of its
# own — style "inline_prefix", not "free_text". Works whether or not
# `ref_audio` is also given, i.e. for both voice design and cloning.
[backend.mlx.prompt_format]
style = "inline_prefix"
inline = { syntax = "(description)text" }
knobs = [
    { name = "cfg_value", default = 2.0 },
    { name = "inference_timesteps", default = 10 },
]
hint = "(cheerful, slightly faster)Hello there."

