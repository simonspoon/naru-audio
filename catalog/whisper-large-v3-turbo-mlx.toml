# OpenAI's Whisper large-v3-turbo (MIT), converted for MLX by mlx-community
# and served by the MLX sidecar's mlx-whisper (§5.3): multilingual, with
# word timestamps. `mlx_whisper.load_model` reads only these two files.

[model]
name        = "whisper-large-v3-turbo-mlx"
kind        = "stt"
backend     = "mlx"
# Listed on Intel too, so it shows there with x_available:false (§3.6).
platforms   = ["macos-arm64", "macos-x86_64"]
# Whisper's 99 language codes (mlx_whisper.tokenizer.LANGUAGES).
languages   = [
              "en", "zh", "de", "es", "ru", "ko", "fr", "ja", "pt", "tr", "pl", "ca",
              "nl", "ar", "sv", "it", "id", "hi", "fi", "vi", "he", "uk", "el", "ms",
              "cs", "ro", "da", "hu", "ta", "no", "th", "ur", "hr", "bg", "lt", "la",
              "mi", "ml", "cy", "sk", "te", "fa", "lv", "bn", "sr", "az", "sl", "kn",
              "et", "mk", "br", "eu", "is", "hy", "ne", "mn", "bs", "kk", "sq", "sw",
              "gl", "mr", "pa", "si", "km", "sn", "yo", "so", "af", "oc", "ka", "be",
              "tg", "sd", "gu", "am", "yi", "lo", "uz", "fo", "ht", "ps", "tk", "nn",
              "mt", "sa", "lb", "my", "bo", "tl", "mg", "as", "tt", "haw", "ln", "ha",
              "ba", "jw", "su"
]
license     = "MIT"
license_url = "https://github.com/openai/whisper/blob/main/LICENSE"
resident_bytes = 1_800_000_000           # estimate; the sidecar's `stats` corrects it
requires    = ["silero-vad"]

[[file]]
path   = "weights.safetensors"
url    = "https://huggingface.co/mlx-community/whisper-large-v3-turbo/resolve/a4aaeec0636e6fef84abdcbe3544cb2bf7e9f6fb/weights.safetensors"
sha256 = "951ed3fc1203e6a62467abb2144a96ce7eafca8fa77e3704fdb8635ff3e7f8a6"
size   = 1_613_977_612

