[package]
name = "naru-audio"
version = "0.14.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Local speech-to-text and text-to-speech daemon for Naru"

# Off by default: pulls in llama.cpp (cmake, Metal on macOS) for the ambient gate (src/ambient/llama.rs).
[features]
llama = ["dep:llama-cpp-2"]

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
base64 = "0.22"
bzip2 = "0.6"
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hound = "3.5.1"
humantime = "2"
llama-cpp-2 = { version = "0.1.158", optional = true, default-features = false, features = ["metal"] }
rubato = "5.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sherpa-onnx = "=1.13.6"
# Not used directly: sherpa-onnx 1.13.6 does not build against sys 1.13.8.
sherpa-onnx-sys = "=1.13.6"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util", "signal"] }
tokio-tungstenite = "0.29"
toml = "1"
toml_edit = "0.25"
ureq = "3"

# Calls sysconf (non-macOS unix) and the mach/sysctl APIs (macOS).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Smart Turn end-of-turn model (src/turn.rs). ort-sys links nothing itself
# (`disable-linking`): the ONNX Runtime that sherpa-onnx-sys already links
# statically serves both, so no ORT_LIB_LOCATION and no second copy.
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "api-24"] }
ort-sys = { version = "=2.0.0-rc.13", default-features = false, features = ["disable-linking"] }
realfft = "3"
# Headless mic capture (src/mic.rs, naru task 2371). coreaudio-sys and
# core-foundation-sys are the versions cpal already pulls in; mic.rs reads the
# devices' transport type and name with them to find the built-in mic.
cpal = "0.15"
coreaudio-sys = "0.2"
core-foundation-sys = "0.8"

# Native MLX (src/mlx/native.rs), Apple Silicon only: MLX does not build for
# x86_64 macOS. Builds MLX from source with CMake and the Xcode Metal toolchain;
# mlx.metallib must sit next to the binary (build.rs, .cargo/config.toml).
[target.'cfg(all(target_arch = "aarch64", target_os = "macos"))'.dependencies]
mlx-rs = "=0.32.0"
# Breeze's mxfp8 quantized matmul and dequantize (src/mlx/breeze.rs): mlx-rs
# hardcodes MLX's affine mode. The version mlx-rs 0.32 already pulls in.
mlx-sys = "=0.6.0"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

# Replaces macOS `afconvert` where it does not exist (src/transcode.rs).
[target.'cfg(not(target_os = "macos"))'.dependencies]
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "alac", "flac", "aiff", "caf", "wav", "pcm"] }

[dev-dependencies]
# Also here so src/transcode.rs's tests run on macOS.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "alac", "flac", "aiff", "caf", "wav", "pcm"] }
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# mlx-sys builds MLX as CMake Debug when its build script has debug
# assertions, which compiles mlx.metallib with Metal logging into the same
# target/mlx/ the release binary ships from. Keep it Release in every profile.
[profile.dev.package.mlx-sys]
debug-assertions = false
