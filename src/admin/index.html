<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>naru-audio admin</title>
<link rel="stylesheet" href="/admin/admin.css">
<script src="/admin/js/theme-init.js"></script>
</head>
<body>
<div id="app">
  <header class="app-header" id="topbar">
    <a class="brand" href="#overview">
      <!-- Naru's mark, as in Naru's header (naru/docs/naru-icon.svg). -->
      <svg class="brand-mark" viewBox="0 0 64 64" role="img" aria-hidden="true">
        <g stroke-linecap="round">
          <g stroke="#07030f" stroke-width="6" stroke-opacity="0.55">
            <line x1="8" y1="28" x2="8" y2="36"/>
            <line x1="16" y1="21" x2="16" y2="43"/>
            <line x1="24" y1="14" x2="24" y2="50"/>
            <line x1="32" y1="8" x2="32" y2="56"/>
            <line x1="40" y1="14" x2="40" y2="50"/>
            <line x1="48" y1="21" x2="48" y2="43"/>
            <line x1="56" y1="28" x2="56" y2="36"/>
          </g>
          <g stroke-width="4">
            <line x1="8" y1="28" x2="8" y2="36" stroke="#8a2bff"/>
            <line x1="16" y1="21" x2="16" y2="43" stroke="#ff2bd6"/>
            <line x1="24" y1="14" x2="24" y2="50" stroke="#2b8aff"/>
            <line x1="32" y1="8" x2="32" y2="56" stroke="#29e6ff"/>
            <line x1="40" y1="14" x2="40" y2="50" stroke="#2b8aff"/>
            <line x1="48" y1="21" x2="48" y2="43" stroke="#ff2bd6"/>
            <line x1="56" y1="28" x2="56" y2="36" stroke="#8a2bff"/>
          </g>
          <g stroke="#f1e6ff" stroke-width="1.2">
            <line x1="8" y1="28" x2="8" y2="36"/>
            <line x1="16" y1="21" x2="16" y2="43"/>
            <line x1="24" y1="14" x2="24" y2="50"/>
            <line x1="32" y1="8" x2="32" y2="56"/>
            <line x1="40" y1="14" x2="40" y2="50"/>
            <line x1="48" y1="21" x2="48" y2="43"/>
            <line x1="56" y1="28" x2="56" y2="36"/>
          </g>
        </g>
      </svg>
      <span class="brand-text">
        <span>Naru<span class="brand-sub">audio</span></span>
        <span class="brand-version" id="brand-version"></span>
      </span>
    </a>
    <div class="header-right">
      <span class="pill" id="online-pill">connecting…</span>
      <span class="pill" id="tts-pill"></span>
      <span class="pill" id="stt-pill"></span>
      <span class="pill" id="mem-pill"></span>
      <select class="inp theme-select" id="theme-select" aria-label="Theme" title="Theme">
        <option value="system">System</option>
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="contrast">High contrast</option>
        <option value="crimson">Crimson</option>
      </select>
    </div>
  </header>
  <div class="offline-banner" id="offline-banner" role="alert" hidden>
    <span><strong>Can't reach naru-audio.</strong> The server may be stopped or restarting; pages won't load or save until it's back. Checking again every few seconds.</span>
    <button type="button" class="btn" id="offline-retry">Retry now</button>
  </div>
  <div class="shell-body">
    <nav class="sidebar" id="sidebar">
      <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Collapse navigation" title="Collapse navigation">«</button>
      <a class="nav-item" href="#overview" data-tab="overview">Overview</a>
      <a class="nav-item" href="#models" data-tab="models">Models</a>
      <a class="nav-item" href="#voices" data-tab="voices">Voices</a>
      <a class="nav-item" href="#clone" data-tab="clone">Clone</a>
      <a class="nav-item" href="#design" data-tab="design">Design</a>
      <a class="nav-item" href="#playground" data-tab="playground">Playground</a>
      <a class="nav-item" href="#samples" data-tab="samples">Samples</a>
    </nav>
    <main id="view"></main>
  </div>
</div>
<div id="toasts"></div>
<script type="module" src="/admin/js/app.mjs"></script>
</body>
</html>
