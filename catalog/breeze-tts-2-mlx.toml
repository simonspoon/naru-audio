# Breeze TTS 2 (BreezeBlue), mlx-community's bf16 conversion, served by
# mlx-audio in the MLX sidecar (§5.3). A seventh cloning model, and the
# third (after VoxCPM2 and OmniVoice) that also designs a voice from a
# description: it clones a reference recording the same way as the
# Qwen3-TTS Base pair, Chatterbox, VoxCPM2, IndexTTS and OmniVoice (no
# preset speakers, so its voices are the cloned ones under
# $NARU_AUDIO_HOME/voices/, each passed to mlx-audio as `ref_audio` with
# its transcript as `ref_text`), and separately takes the request's
# `instructions` as mlx-audio's `instruct` to make a voice up from a
# description. 24 kHz output (`model.sample_rate`).
#
# `speed` is not supported at all — mlx-audio's Breeze `generate` has no
# `speed` parameter, so it would otherwise be swallowed silently by its own
# `**kwargs`; the sidecar shim errors on a non-1.0 speed instead
# (`naru_audio_mlx/__main__.py`), as for Chatterbox, VoxCPM2, IndexTTS and
# OmniVoice. Unlike those four, Breeze's `generate` does declare a
# `streaming_interval` parameter and accepts the sidecar's usual streaming
# cadence without error (confirmed 2026-09-26 by pulling this model and
# running `say` end to end); no shim is needed for it.
#
# Only mlx-community's full-precision conversion is used, not their 4-bit
# or 8-bit ones: task-1446 does not ask for a smaller quantization, and the
# bf16 repo is the one whose size (~7.6 GB total) matches the brief.
#
# Licence: this is BreezeBlue's own research/non-commercial grant, not an
# OSI license — "This Agreement permits research and non-commercial use of
# the Model Materials free of charge. It does not grant any commercial
# rights and is not an open source license. Commercial use requires a
# separate written license from BreezeBlue." (LICENSE, pinned below) — so
# `non_commercial` is set, same as pocket-tts-int8 and omnivoice-bf16-mlx.
#
# Every [[file]] of the repo at the pinned commit but README.md and
# .gitattributes; sizes and LFS hash from the HF API, the small files'
# hashes computed 2026-09-26 from the files at the pinned commit.

[model]
name        = "breeze-tts-2-mlx"
kind        = "tts"
backend     = "mlx"
# Listed on Intel too, so it shows there with x_available:false (§3.6).
platforms   = ["macos-arm64", "macos-x86_64"]
languages   = ["en", "zh"]
license     = "BreezeBlue Research and Non-Commercial License"
license_url = "https://huggingface.co/mlx-community/Breeze-TTS-2-mlx/blob/3c8829fb7fd335818f085cd2ef49b4100c0e46c8/LICENSE"
non_commercial = true                    # see the LICENSE excerpt above

[backend.mlx]
# Speaks in the cloned voices under $NARU_AUDIO_HOME/voices/.
clone = true
# Its `generate` raises outright without a transcript alongside the
# reference clip (breeze_tts.py: "Breeze voice cloning requires ref_text
# with ref_audio.").
clone_requires_transcript = true
# Takes the request's `instructions` as mlx-audio's `instruct`, to make a
# voice up from a description instead of cloning one.
instruct = true

# One free-text instruction, for a voice design or direction on a clone
# alike (`breeze_tts.py`: `target = f"{speaker}<ins_bos>{instruct}<ins_eos>{text}"`).
# Inline tags are BreezeBlue's own model card syntax, not something
# mlx-audio's `breeze_tts.py` parses specially — they are plain text the
# model was trained to recognise, English in parentheses and Chinese in
# brackets. `cfg_scale`'s default is `generate`'s own (no CFG unless set);
# 4 is the card's recommendation for voice design/direction, not a code
# default.
[backend.mlx.prompt_format]
style = "free_text"
inline = { syntax = "(tag) or [标签]", tags = ["laugh", "sigh", "clears throat", "笑", "叹气"], example = "(laugh) That's hilarious!" }
knobs = [{ name = "cfg_scale", default = 4.0, min = 0.0, max = 10.0 }]
hint = "Speak slowly and warmly, like reading a bedtime story"

