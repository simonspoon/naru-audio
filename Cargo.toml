[package]
name = "naru-audio"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Local speech-to-text and text-to-speech daemon for Naru"

[dependencies]
axum = "0.8"
bzip2 = "0.6"
clap = { version = "4", features = ["derive", "env"] }
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
toml = "1"
ureq = "3"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
